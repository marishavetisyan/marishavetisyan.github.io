<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Դարպասի հաշվիչ</title>

<style>
img {
  border-radius: 19%;
  border-bottom: 6px solid #ff7a00;
  box-shadow: 0 -1px 20px rgba(0,0,0,0.08);
}
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 80px;
}

#logo {
    text-align: center;
}

.warning {
      font-size: 10pt;
    }

a {
  pointer-events: none;
  opacity: 0.3;
  display: block;
  width: 50%;
  margin: 50px auto 10px;
  padding: 12px;
  background: #ff7a00;
  color: white;
  text-align: center;
  text-decoration: none;
  border-radius: 8px;
  font-weight: bold;
  margin-bottom: 20px;
}
@media (max-width: 750px) {
    .container {
        flex-direction: column;
        gap: 30px;
    }
    a{
      margin: 0 auto 10px;
    }

    #logo {
        order: -1;      /* logo on top */
    }

    .card {
        max-width: 500px;
        background: #fff;
        padding: 22px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        border-top: 6px solid #ff7a00;
        position: relative;
    }
}
body {
  margin: 0;
  font-family: system-ui, Arial;
  background: #fff7f2;
  color: #222;
}

.minus  {
  margin-left: auto;
  
}
.plus {
  margin-left: auto;
}

.container {
  display: flex;
  gap: 40px;
  padding: 60px 10%;
  align-items: center;
}

.container h1 {
  font-size: 42px;
  margin: 0;
}

.container p {
  color: #666;
  margin-top: 10px;
}

.card {
  width: 90%;
  min-width: 207px;
  background: #fff;
  padding: 22px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  border-top: 6px solid #ff7a00;
  position: relative;
  
}

.row {
  padding: 0 12px;
}

.row label {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 93%;
}

.row input[type="range"] {
  width: 100%;
}

label {
  font-size: 20px;
}

input {
  width: 60px;
  padding: 10px;
  margin-top: 6px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 20px;
}

button {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: #ff7a00;
  color: white;
  cursor: pointer;
  font-size: 20px;
}

.birka {
  margin-top: 14px;
  font-size: 20px;
  line-height: 1.7;
  padding-bottom: 60px;
}

/* PRICE/M² BADGE */
.sqm-badge {
  position: absolute;
  bottom: 14px;
  right: 14px;
  background: rgb(265 255 248);
  color: #ff7a00;
  padding: 10px 12px;
  border-radius: 12px;
  font-size: 19px;
  font-weight: 600;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}

/* SECTIONS */
.section {
  padding: 60px 10%;
}
</style>
</head>

<body>

<div class="container">
  <div id="logo">
    <img style="width:170px;" src="https://marishavetisyan.github.io/logo.png">
    <p>Հաշվիր քո դարպասի արժեքը 30 վայրկյանում</p>
  </div>
  <div class="card">

    <div class="row">

  <label style="display:block; margin-bottom:20px;">

    <div style="display:flex; align-items:center; justify-content:space-between;">
      
      <span>
        Լայնություն (մ): <span id="wVal">3.2</span>
      </span>

      <div style="display:flex; gap:6px;">
        <button class="minus" type="button" onclick="changeW(-0.1)">−</button>
        <button class="plus" type="button" onclick="changeW(0.1)">+</button>
      </div>

    </div>

    <input type="range" id="w" min="2" max="6" step="0.1" value="3.2"
      oninput="syncW(this.value)" style="width:100%; margin-top:8px;">

  </label>


  <label style="display:block; margin-bottom:20px;">

    <div style="display:flex; align-items:center; justify-content:space-between;">
      
      <span>
        Բարձրություն (մ): <span id="hVal">2.5</span>
      </span>

      <div style="display:flex; gap:6px;">
        <button class="minus" type="button" onclick="changeH(-0.1)">−</button>
        <button class="plus" type="button" onclick="changeH(0.1)">+</button>
      </div>

    </div>

    <input type="range" id="h" min="2" max="4" step="0.1" value="2.5"
      oninput="syncH(this.value)" style="width:100%; margin-top:8px;">

  </label>

</div>

    <div style="margin-top:10px;">
      <label onclick="deactivateOldCost()" style="display:inline-flex; align-items:center; gap:6px;">
        Հեռակառավարում -
        <input type="checkbox" id="auto" checked style="transform: scale(1.5);" ">
      </label>
    </div>

    <div style="margin-top:10px; ">
      <label onclick="deactivateOldCost()" style="display:inline-flex; align-items:center; gap:6px; white-space:nowrap;">
        Դռնակ / կալիտկա -
        <input type="checkbox" id="door" style="transform: scale(1.5);">
      </label>
    </div>

    <div style="margin-top:10px;">
      <label onclick="deactivateOldCost()" style="display:inline-flex; align-items:center; gap:6px; white-space:nowrap;">
        Տեղադրում -
        <input type="checkbox" id="install" checked style="transform: scale(1.5);" onclick="validateFrame()">
      </label>
    </div>

    <div style="margin-top:10px;" id="frameContainer">
      <label onclick="deactivateOldCost()" style="display:inline-flex; align-items:center; gap:6px; white-space:nowrap;">
        Մետաղական կարկաս - 
        <input type="checkbox" id="frame" style="transform: scale(1.5);">
      </label>
    </div>

    <button onclick="calc()">Հաշվել</button>

    <div class="birka" id="sqm"></div>

  </div>
</div>
<a id="order" href="https://docs.google.com/forms/d/e/1FAIpQLSeBNGDqF-GJvDmMKmslU4ZAtGvtgqbIj5WjyQndjuQBDQv8Ww/viewform?usp=publish-editor"
  target="_blank">
  Պատվիրել չափագրում
</a>
<div style="
    text-align: center;
    margin-bottom: 30px;
    margin-top: 0;
  ">
  Հարցերի դեպքում զանգահարել 033 113 100
</div>
<script>

const products = [
  { w: 3.2, price: 600000 },
  { w: 3.7, price: 660000 },
  { w: 4.2, price: 760000 },
  { w: 4.5, price: 793000 },
  { w: 5.1, price: 893000 },
  { w: 6, price: 993000 }
];
const stdh = 2.5;

const w = document.getElementById('w');
const wVal = document.getElementById('wVal');
const h = document.getElementById('h');
const hVal = document.getElementById('hVal');

const install = document.getElementById("install").checked;

function activateOrder(a = true) {
  document.getElementById("order").style.opacity = a ? 1 : 0.3;
  document.getElementById("order").style.pointerEvents = a ? "auto" : "none";
}

function deactivateOldCost() {
  document.getElementById("sqm").style.opacity = .3;
  activateOrder(false);
}

function syncW(val){
    deactivateOldCost();
    wVal.textContent = Number(val).toFixed(1);
  }

function changeW(delta){
    deactivateOldCost();
    let newValue = parseFloat(w.value) + delta;

    // սահմանների պահպանում
    newValue = Math.max(2, Math.min(6, newValue));

    w.value = newValue.toFixed(1);
    syncW(newValue);
}

function syncH(val){
    deactivateOldCost();
    hVal.textContent = Number(val).toFixed(1);
  }

function changeH(delta){
    deactivateOldCost();
    let newValue = parseFloat(h.value) + delta;

    // սահմանների պահպանում
    newValue = Math.max(2, Math.min(6, newValue));

    h.value = newValue.toFixed(1);
    syncH(newValue);
}

function validateFrame() {
  let installNeeded = document.getElementById("install").checked;
  document.getElementById("frameContainer").innerHTML = installNeeded ? `
        <label onclick="deactivateOldCost()" style="display:inline-flex; align-items:center; gap:6px; white-space:nowrap;">
          Մետաղական կարկաս - 
          <input type="checkbox" id="frame" style="transform: scale(1.5);">
        </label>
    ` : ""; 
}

function calc() {

  const w = parseFloat(document.getElementById("w").value);
  const h = parseFloat(document.getElementById("h").value);

  const auto = document.getElementById("auto").checked;
  const door = document.getElementById("door").checked;
  const frame = document.getElementById("frame") ? document.getElementById("frame").checked : false;

  let wSelected = products.find(p => p.w === w);
  let hSelected = stdh === h;
  let wMatched = !!wSelected;
  let hMatched = !!hSelected;
  let assembly = 0;

// validating complects with standard widths and height
  if (!wSelected) {
    wSelected = products.find(p => p.w >= w);
    if (!wSelected) {
      document.getElementById("sqm").innerHTML =
        "Տվյալ լայնության համար անհրաժեշտ է անհատական հաշվարկ";
      return;
    } else {
      assembly = 50000;
    }
  }

  let lines = [];
  let complect = wSelected.price;
  let total = complect;

// remote 
  const sqm = w * h;
  if (!auto) {
    const motorPrice = (sqm <= 10) ? 147000 : 160000;
    total -= motorPrice;
    lines.push(`● Ստանդարտ չափ ${"(" +wSelected.w + "x2.5) <br> 5 հատ " + Math.round(wSelected.w*100) + "x50սմ սեկցիա" + " - "+(complect-motorPrice).toLocaleString()}&nbsp;AMD`);
  } else {
    lines.push(`● Ստանդարտ չափ ${"(" +wSelected.w + "x2.5) <br> 5 հատ " + Math.round(wSelected.w*100) + "x50սմ սեկցիա" + " - "+(complect).toLocaleString()}&nbsp;AMD`);
  }

// height
  let panelHeight = 0.5;
  let panelPrice = 90000;
  if (!hSelected) {
    let panelsCount = h/panelHeight;
    let panelsDifference = panelsCount - 5;
    
    if (panelsDifference>2||panelsDifference<-1) {
      document.getElementById("sqm").innerHTML =
        "Տվյալ բարձրության համար անհրաժեշտ է անհատական հաշվարկ";
      return;
    } else {
      total+= Math.ceil(panelsDifference)*Math.round(panelPrice * w / 1000 / 6)*1000;
      if(Math.ceil(panelsDifference) !== 0) {
        lines.push(`● Լրացուցիչ սեկցիաներ <br>
          ${Math.ceil(panelsDifference)} հատ ${Math.round(w*100)}x50սմ սեկցիա - 
          ${parseInt(Math.ceil(panelsDifference) * Math.round(panelPrice * w / 1000 / 6))},000&nbsp;AMD
          `);
      }
      // cuts
      if(Math.ceil(panelsDifference) === panelsDifference) {
      } else {
          //horizontal cuts
          assembly += 50000;
      }
      //vertical cuts
      if(panelsDifference>0)
      assembly += Math.ceil(panelsDifference)*10000;
    }
  }

  let passingDoor = 200000;

    if (door) {
    total += passingDoor;
    lines.push("● Դռնակ / կալիտկա - 200,000&nbsp;AMD");
  }
//assembly
  if (wMatched&&hMatched) {
  } else {
    total += assembly;
    if(assembly)lines.push("● Կտրում, հավաքում - " + assembly/1000 + ",000&nbsp;AMD");
  }
//installation
  const install = document.getElementById("install").checked;
  if (install) {
    let i = 100000;
    if((sqm>10)) i += 50000;
    total+= i;
    lines.push("● Տեղադրում - " + i/1000 + ",000&nbsp;AMD");
  } else {
    activateOrder(false);
  }
//frame
  if (frame) {
    let framePrice = 50000;
    if(sqm>10) framePrice+= 25000;
    total += framePrice;
    lines.push("● Մետաղական կարկաս - " + framePrice/1000 + ",000&nbsp;AMD");
  } 

  // sqm price
  const sqmPrice = Math.round(total / sqm);

  const badge = `
    <div class="sqm-badge">
      ${sqmPrice.toLocaleString()} դրամ / մ²
    </div>
  `;
let html = `
    <div style="margin-bottom:10px;font-weight:bold;color:#ff7a00;">
      Արժեքը՝ <br>
    </div>
  `;

  lines.push()
  html += lines.map(l => `<div>${l}</div>`).join("");
  html += ` <div style="margin-bottom:10px;font-weight:bold;color:#ff7a00;">
  Ընդհանուր - ${total.toLocaleString()} AMD
  </div>`;
  html += "<div class='warning'>*Արժեքը չի ներառում ԱԱՀ</div>";
  html += "<div class='warning'>*Չափագրումից հետո պատվերը չեղարկելու դեպքում չափագրման արժեքը (20.000 դրամ) ենթակա է վճարման</div>";
  html += "<div class='warning'>*Չափագրման ժամանակ դարպասի արժեքը կարող է փոխվել մինչև +&nbsp;/&nbsp;−&nbsp;50.000&nbsp;դրամ</div>";
  html += badge;

  document.getElementById("sqm").innerHTML = html;
  document.getElementById("sqm").style.opacity = 1;
  activateOrder(install);
}

</script>

</body>
</html>
