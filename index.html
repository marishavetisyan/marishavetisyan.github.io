function getCookieValue(name) {
  return document.cookie
    .split(";")
    .map(function(part) { return part.trim(); })
    .find(function(part) { return part.startsWith(name + "="); })
    ?.slice(name.length + 1) || "";
}

function setVisitorCookie(value) {
  document.cookie = `mastergate_visitor_id=${encodeURIComponent(value)}; Max-Age=31536000; Path=/; SameSite=Lax`;
}

function sanitizeCampaignName(value) {
  return String(value || "").replace(/[\r\n\t]/g, " ").replace(/\s+/g, " ").trim().slice(0, 80);
}

function setCampaignCookie(value) {
  document.cookie = `mastergate_campaign=${encodeURIComponent(value)}; Max-Age=31536000; Path=/; SameSite=Lax`;
}

function getActiveCamp() {
  const params = getCalculatorUrlParams();
  const campFromUrl = sanitizeCampaignName(params.get("camp") || params.get("?camp"));
  if (campFromUrl) {
    try {
      localStorage.setItem("mastergate_campaign", campFromUrl);
    } catch (error) {}
    setCampaignCookie(campFromUrl);
    return campFromUrl;
  }

  let savedCamp = "";
  try {
    savedCamp = sanitizeCampaignName(localStorage.getItem("mastergate_campaign"));
  } catch (error) {
    savedCamp = "";
  }
  if (!savedCamp) {
    try {
      savedCamp = sanitizeCampaignName(decodeURIComponent(getCookieValue("mastergate_campaign")));
    } catch (error) {
      savedCamp = "";
    }
  }
  if (savedCamp) setCampaignCookie(savedCamp);
  return savedCamp;
}

function createVisitorId() {
  if (window.crypto && typeof window.crypto.randomUUID === "function") {
    return `mg_${window.crypto.randomUUID()}`;
  }
  return `mg_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 12)}`;
}

function getVisitorId() {
  const storageKey = "mastergate_visitor_id";
  let value = "";
  try {
    value = localStorage.getItem(storageKey) || "";
  } catch (error) {
    value = "";
  }
  if (!value) {
    value = decodeURIComponent(getCookieValue("mastergate_visitor_id"));
  }
  if (!/^mg_[a-zA-Z0-9_-]{8,80}$/.test(value)) {
    value = createVisitorId();
  }
  try {
    localStorage.setItem(storageKey, value);
  } catch (error) {}
  setVisitorCookie(value);
  return value;
}

function trackEvent(name, params = {}) {
  if (typeof window.gtag === "function") {
    window.gtag("event", name, params);
  }
  logAnalyticsClick(name, params);
}

function logAnalyticsClick(name, params = {}) {
  if (googleAnalyticsOnlyEvents.has(name)) return;

  const payload = JSON.stringify({
    visitorId,
    event: name,
    params,
    page: window.location.pathname,
    referrer: document.referrer || ""
  });
  if (navigator.sendBeacon) {
    navigator.sendBeacon("/api/analytics-click", new Blob([payload], { type: "application/json" }));
    return;
  }
  fetch("/api/analytics-click", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: payload,
    keepalive: true
  }).catch(() => {});
}

function updateRangeProgress(input) {
  const min = Number(input.min || 0);
  const max = Number(input.max || 100);
  const value = Number(input.value || 0);
  const progress = ((value - min) / (max - min)) * 100;
  input.style.setProperty("--range-progress", `${Math.max(0, Math.min(100, progress))}%`);
}

function clampDimension(value, min, max) {
  const parsed = Number.parseFloat(String(value).replace(",", "."));
  if (!Number.isFinite(parsed)) return null;
  return Math.max(min, Math.min(max, Math.round(parsed * 100) / 100));
}

function makeOldCost(val=0.3) {

function parseBooleanQueryValue(value) {
  if (value === null) return null;
  const normalized = String(value).trim().toLowerCase();
  if (["1", "true", "yes", "on", "y"].includes(normalized)) return true;
  if (["0", "false", "no", "off", "n"].includes(normalized)) return false;
  return null;
}

function getFirstQueryValue(params, names) {
  for (const name of names) {
    if (params.has(name)) return params.get(name);
  }
  return null;
}

function getCalculatorUrlParams() {
  if (window.location.search) {
    return new URLSearchParams(window.location.search);
  }
  const pathState = window.location.pathname.replace(/^\/+/, "");
  if (/^(width|w|height|h|camp)=/i.test(pathState)) {
    return new URLSearchParams(pathState);
  }
  return new URLSearchParams();
}

function applyQueryCalculatorState() {
  const params = getCalculatorUrlParams();
  const width = clampDimension(getFirstQueryValue(params, ["width", "w"]), 2, 6);
  const height = clampDimension(getFirstQueryValue(params, ["height", "h"]), 2, 4);
  const optionParams = {
    auto: parseBooleanQueryValue(getFirstQueryValue(params, ["auto", "remote"])),
    door: parseBooleanQueryValue(getFirstQueryValue(params, ["door", "wicket"])),
    install: parseBooleanQueryValue(getFirstQueryValue(params, ["install", "installation"])),
    frame: parseBooleanQueryValue(getFirstQueryValue(params, ["frame", "metalFrame"]))
  };
  const hasQueryState = width !== null || height !== null || Object.values(optionParams).some(function(value) { return value !== null; });

  if (width !== null) {
    w.value = width.toFixed(2);
    wVal.textContent = width.toFixed(2);
    updateRangeProgress(w);
  }
  if (height !== null) {
    h.value = height.toFixed(2);
    hVal.textContent = height.toFixed(2);
    updateRangeProgress(h);
  }
  if (hasQueryState) {
    document.getElementById("auto").checked = optionParams.auto === true;
    document.getElementById("door").checked = optionParams.door === true;
    document.getElementById("install").checked = optionParams.install === true;
  }

  validateFrame();
  if (hasQueryState && document.getElementById("frame")) {
    document.getElementById("frame").checked = optionParams.frame === true && document.getElementById("install").checked;
  }
  syncOrderAddressFields(document.getElementById("install").checked);

  if (hasQueryState) {
    lastCalculation = null;
    lastLoggedCalculationKey = "";
    setCalculateStale(true);
    updateOrderAvailability();
  }
}

  if (shouldShowPhoneGate()) {
    openPhoneGate();

function performCalculation() {

    width: parseFloat(document.getElementById("w").value),

    ...getSelectedOptions()

  lastCalculation = {
    width: result.width,

    area: result.area,
    auto: result.auto,
    door: result.door,
    install: result.install,
    frame: result.frame,
    matchedStandardWidth: result.matchedStandardWidth,
    matchedStandardHeight: result.matchedStandardHeight,
    selectedStandardWidth: result.selectedStandardWidth,
    individualRequired: result.individualRequired,
    individualReason: result.individualReason,
    total: result.total,
    sqmPrice: result.sqmPrice,
    lines: result.lines
  };

  document.getElementById("sqm").innerHTML = result.html;
  setCalculateStale(false);
  makeOldCost(1);
  updateOrderAvailability();
  trackEvent("calculate", {
    width: lastCalculation.width,
    height: lastCalculation.height,

  const targetInput = document.getElementById("customerPhone");

  if (!targetInput || !targetCountry) return;

  const normalizedCountry = String(countryIso || "AM").toUpperCase();
  const visiblePhone = String(nationalPhone || "").trim();
  const valueToShow = visiblePhone || String(phone || "").trim();
  targetCountry.value = normalizedCountry;
  if (phonePlugin) {
    if (typeof phonePlugin.setCountry === "function") {
      phonePlugin.setCountry(normalizedCountry.toLowerCase());
    }
    if (typeof phonePlugin.setNumber === "function" && phone) {
      phonePlugin.setNumber(phone);
    }
  }
  if (valueToShow) {
    targetInput.value = valueToShow;
  }
  normalizeArmenianPhoneInput(targetInput);
  targetInput.dispatchEvent(new Event("input", { bubbles: true }));
  targetInput.dispatchEvent(new Event("change", { bubbles: true }));
}

  const sourceInput = document.getElementById("phoneGateInput");
  const sourceCountry = document.getElementById("phoneGateCountry");

  const selectedCountry = getSelectedPhoneCountry(phoneGatePlugin);
  const countryIso = (selectedCountry.iso2 || sourceCountry.value || "AM").toUpperCase();
  const fullPhone = phone || getNormalizedPhoneNumber("phoneGateInput", phoneGatePlugin);
  const nationalPhone = sourceInput.value.trim();
  savedPhoneGatePhone = {
    phone: fullPhone,
    country: countryIso,
    national: nationalPhone
  };
  localStorage.setItem("mastergate_phone_gate_phone", JSON.stringify(savedPhoneGatePhone));
  setOrderPhoneFromGate(fullPhone, countryIso, nationalPhone);
}

function applySavedPhoneGateToOrderPhone() {
  try {

      setOrderPhoneFromGate(saved.phone, saved.country, saved.national);

  } catch (error) {
    localStorage.removeItem("mastergate_phone_gate_phone");
  }
}

function openModal(modal) {
  clearTimeout(modal.closeTimer);
  document.body.classList.add("modal-locked");
  modal.classList.add("open");

}

function closeModal(modal) {
  if (!modal.classList.contains("open")) return;
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
  clearTimeout(modal.closeTimer);
  modal.closeTimer = setTimeout(() => {
    if (!document.querySelector(".modal.open")) {

  }, 240);
}

  if (Number.isFinite(lastCalculation.total)) {

    value.classList.toggle("is-discounted", pricing.discountPercent > 0);
    prepaymentValue.textContent = `${pricing.prepaymentAmount.toLocaleString()} AMD`;
    prepaymentVatValue.textContent = `Ներառյալ ԱԱՀ՝ ${pricing.prepaymentWithVat.toLocaleString()} AMD`;
    oldPriceValue.hidden = pricing.discountPercent === 0;
    discountBadge.hidden = pricing.discountPercent === 0;
    oldPriceValue.textContent = `${lastCalculation.total.toLocaleString()} AMD`;
    discountBadge.textContent = `-${pricing.discountPercent}%`;
    vatValue.textContent = `Ներառյալ ԱԱՀ՝ ${pricing.totalWithVat.toLocaleString()} AMD`;
  } else {
    value.textContent = "Անհատական հաշվարկ";
    prepaymentSummary.hidden = getSelectedPrepaymentPercent() === 0;
    value.classList.remove("is-discounted");
    prepaymentValue.textContent = "Անհատական հաշվարկ";
    prepaymentVatValue.textContent = "Ներառյալ ԱԱՀ՝ անհատական հաշվարկ";
    oldPriceValue.hidden = true;
    discountBadge.hidden = true;
    vatValue.textContent = "Ներառյալ ԱԱՀ՝ անհատական հաշվարկ";
  }
}

function getSelectedPrepaymentPercent() {

}

function calculateOrderPricing(total, prepaymentPercent) {
  const discountPercent = prepaymentDiscounts[prepaymentPercent] || 0;
  const discountAmount = Math.round(total * discountPercent / 100);
  const discountedTotal = Math.max(0, total - discountAmount);
  return {
    prepaymentPercent,
    discountPercent,
    discountAmount,
    discountedTotal,
    prepaymentAmount: Math.round(total * prepaymentPercent / 100),
    prepaymentWithVat: Math.round(total * prepaymentPercent / 100 * 1.2),
    totalWithVat: Math.round(discountedTotal * 1.2)
  };
}

function submitIdramPayment(payment) {

    input.type = "hidden";
    input.name = name;
    input.value = value;
    form.appendChild(input);

function formatAgreementDate(offsetDays) {

  date.setDate(date.getDate() + offsetDays);

  const month = String(date.getMonth() + 1).padStart(2, "0");
  return `${day}.${month}.${date.getFullYear()}`;
}

function handleAgreementPointer(event, key) {
  if (event.pointerType === "mouse" && event.button !== 0) {
    return;
  }

  event.preventDefault();
  event.stopPropagation();

  const label = event.currentTarget;
  const checkbox = label.querySelector(`.agreement-checkbox[data-agreement="${key}"]`);
  if (!checkbox) return;

  if (checkbox.checked) {
    checkbox.checked = false;
    checkbox.dispatchEvent(new Event("change", { bubbles: true }));
    return;
  }

  openAgreementInfo(event, key);
}

function handleAgreementKey(event, key) {
  if (event.key === " " || event.key === "Enter") {
    const checkbox = event.currentTarget;
    event.preventDefault();
    event.stopPropagation();

    if (checkbox.checked) {
      checkbox.checked = false;
      checkbox.dispatchEvent(new Event("change", { bubbles: true }));
      return;
    }

    openAgreementInfo(event, key);
  }
}

function acceptAgreementFromInfo() {
  if (activeAgreementKey) {
    const checkbox = document.querySelector(`.agreement-checkbox[data-agreement="${activeAgreementKey}"]`);
    if (checkbox) {
      checkbox.checked = true;
      checkbox.dispatchEvent(new Event("change", { bubbles: true }));
    }
  }
  trackEvent("agreement_read", { agreement: activeAgreementKey });
  trackAgreementStatus("accepted");
  closeAgreementInfo(true);
}

function trackAgreementStatus(status) {
  if (!activeAgreementKey || activeAgreementStatusTracked) return;
  activeAgreementStatusTracked = true;
  trackEvent("agreement_status", {
    agreement: activeAgreementKey,
    status
  });
}

document.getElementById("orderForm").addEventListener("submit", async function(event) {
  event.preventDefault();
  if (!lastCalculation) return;

  const submitButton = document.getElementById("sendOrder");
  submitButton.disabled = true;
  setFormStatus("Ուղարկվում է...");

  try {
    applySavedPhoneGateToOrderPhone();
    const phoneInput = document.getElementById("customerPhone");
    normalizeArmenianPhoneInput(phoneInput);
    const selectedCountry = getSelectedPhoneCountry();
    const fullPhone = getNormalizedPhoneNumber();
    if (!isValidPhone(fullPhone)) {
      throw new Error("Լրացրեք վավեր հեռախոսահամար");
    }

    const address = getOrderAddress();
    if (!address) {
      throw new Error("Ընտրեք մարզը և համայնքը");
    }
    const prepaymentPercent = getSelectedPrepaymentPercent();
    const paymentProvider = getSelectedPaymentProvider();
    if (prepaymentPercent > 0 && !paymentProvider) {
      throw new Error("Ընտրեք վճարման եղանակը");
    }

    const response = await fetch("/api/order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        visitorId,
        contactMethod: document.getElementById("contactMethod").value,
        phone: fullPhone,
        phoneNational: phoneInput.value.trim(),
        phoneDialCode: selectedCountry.dialCode || "",
        phoneCountry: document.getElementById("phoneCountry").value,
        prepaymentPercent,
        paymentMethod: prepaymentPercent > 0 ? paymentProvider : "none",
        address,
        addressRegion: document.getElementById("addressRegion").value,
        addressCommunity: document.getElementById("addressCommunity").value,
        agreements: getAgreementState(),
        calculation: lastCalculation
      })
    });

    const result = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(result.error || "Չհաջողվեց ուղարկել հայտը");
    }

    if (result.payment && result.payment.provider === "idram") {
      setFormStatus("Վերահղում դեպի Idram...", "success");
      trackEvent("idram_redirect", {
        total: lastCalculation.total,
        install: lastCalculation.install,
        individual_required: lastCalculation.individualRequired
      });
      submitIdramPayment(result.payment);
      return;
    }

    setFormStatus("Հայտն ուղարկված է։ Մենք կկապվենք Ձեզ հետ։", "success");
    trackEvent("order_submit_success", {
      total: lastCalculation.total,
      install: lastCalculation.install,
      individual_required: lastCalculation.individualRequired
    });
    this.reset();
    updatePhoneFieldLabel();
    updatePaymentProviderVisibility();
    syncOrderAddressFields(lastCalculation.install);
  } catch (error) {
    setFormStatus(error.message, "error");
  } finally {
    submitButton.disabled = false;
  }
});

function normalizeCommunitySearch(value) {
  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9ա-ֆև]+/g, " ")
    .replace(/\s+/g, " ");
}

function getFilteredCommunities(query) {
  const region = document.getElementById("addressRegion").value;
  const normalizedQuery = normalizeCommunitySearch(query);
  const compactQuery = normalizedQuery.replace(/\s/g, "");

  return (armeniaCommunities[region] || []).filter(function(community) {
    if (!normalizedQuery) return true;

    const armenianName = normalizeCommunitySearch(community);
    const latinName = normalizeCommunitySearch(armenianToLatin(community));
    const compactArmenianName = armenianName.replace(/\s/g, "");
    const compactLatinName = latinName.replace(/\s/g, "");
    const latinAliases = community.startsWith("Ե") ? [`y${compactLatinName}`] : [];

    return armenianName.includes(normalizedQuery)
      || latinName.includes(normalizedQuery)
      || compactArmenianName.includes(compactQuery)
      || compactLatinName.includes(compactQuery)
      || latinAliases.some(function(alias) { return alias.includes(compactQuery); });
  });
}

function renderCommunityOptions(query) {
  const list = document.getElementById("addressCommunityList");
  const communities = getFilteredCommunities(query);
  list.innerHTML = "";
  list.scrollTop = 0;
  highlightedCommunityIndex = -1;

  if (!communities.length) {
    const empty = document.createElement("div");
    empty.className = "community-empty";
    empty.textContent = "Արդյունք չի գտնվել";
    list.appendChild(empty);
    return;
  }

  communities.forEach(function(community) {
    const option = document.createElement("button");
    option.type = "button";
    option.className = "community-option";
    option.setAttribute("role", "option");
    option.dataset.value = community;
    option.textContent = community;
    option.addEventListener("click", function() {
      selectCommunity(community);
    });
    list.appendChild(option);
  });
}

function moveCommunityHighlight(direction) {
  const options = Array.from(document.querySelectorAll("#addressCommunityList .community-option"));
  if (!options.length) return;

  highlightedCommunityIndex = highlightedCommunityIndex < 0
    ? (direction > 0 ? 0 : options.length - 1)
    : (highlightedCommunityIndex + direction + options.length) % options.length;
  options.forEach(function(option, index) {
    option.classList.toggle("is-highlighted", index === highlightedCommunityIndex);
  });
  options[highlightedCommunityIndex].scrollIntoView({ block: "nearest" });
}

    addressInput.value = "";

function syncOrderAddressFields(installationSelected) {
  const pickupField = document.getElementById("pickupAddressField");
  const installationFields = document.getElementById("installationAddressFields");
  const regionSelect = document.getElementById("addressRegion");
  const communitySelect = document.getElementById("addressCommunity");
  const communitySearch = document.getElementById("addressCommunitySearch");

  pickupField.hidden = installationSelected;
  installationFields.hidden = !installationSelected;
  regionSelect.disabled = !installationSelected || !Object.keys(armeniaCommunities).length;
  communitySelect.disabled = !installationSelected || !regionSelect.value;
  communitySearch.disabled = !installationSelected || !regionSelect.value;

  if (!installationSelected) {
    closeCommunityDropdown();
  }

  if (!installationSelected) {
    document.getElementById("customerAddress").value = pickupAddress;
  } else {
    updateCustomerAddress();
  }
}

function getOrderAddress() {
  if (!lastCalculation.install) return pickupAddress;

  const region = document.getElementById("addressRegion").value;
  const community = document.getElementById("addressCommunity").value;
  if (!region || !community || !(armeniaCommunities[region] || []).includes(community)) return "";

  return region === "Երևան" ? `ք. Երևան, ${community}` : `${region} մարզ, ${community} համայնք`;
}

document.getElementById("addressRegion").addEventListener("change", updateAddressCommunities);
document.getElementById("addressCommunity").addEventListener("change", function() {
  document.getElementById("addressCommunitySearch").value = this.value;
  updateCustomerAddress();
  closeCommunityDropdown();
});
document.getElementById("addressCommunitySearch").addEventListener("focus", openCommunityDropdown);
document.getElementById("addressCommunitySearch").addEventListener("click", openCommunityDropdown);
document.getElementById("addressCommunitySearch").addEventListener("input", function() {
  document.getElementById("addressCommunity").value = "";
  updateCustomerAddress();
  openCommunityDropdown();
});
document.getElementById("addressCommunitySearch").addEventListener("keydown", function(event) {
  if (event.key === "ArrowDown" || event.key === "ArrowUp") {
    event.preventDefault();
    if (document.getElementById("addressCommunityList").hidden) openCommunityDropdown();
    moveCommunityHighlight(event.key === "ArrowDown" ? 1 : -1);
  } else if (event.key === "Enter" && highlightedCommunityIndex >= 0) {
    event.preventDefault();
    const options = document.querySelectorAll("#addressCommunityList .community-option");
    options[highlightedCommunityIndex]?.click();
  } else if (event.key === "Escape") {
    closeCommunityDropdown();
  }
});
document.addEventListener("pointerdown", function(event) {
  if (!document.getElementById("communityPicker").contains(event.target)) {
    closeCommunityDropdown();
  }
});
syncOrderAddressFields(document.getElementById("install").checked);
addressRegionsPromise = loadAddressRegions();

function getSelectedPhoneCountry(plugin = phonePlugin) {
  return plugin ? (plugin.getSelectedCountry() || {}) : {};
}

function getNormalizedPhoneNumber(inputId = "customerPhone", plugin = phonePlugin) {
  const phoneInput = document.getElementById(inputId);
  if (!plugin) return phoneInput.value.trim();
  return plugin.getNumber() || phoneInput.value.trim();
}

function isValidPhone(value, inputId = "customerPhone", plugin = phonePlugin, countryInputId = "phoneCountry") {
  if (isArmenianPhoneSelected(countryInputId) && startsWithZero(document.getElementById(inputId).value)) {
    return false;
  }
  if (!plugin) return /^\+\d{6,15}$/.test(value.replace(/\s/g, ""));
  if (typeof plugin.isValidNumberPrecise === "function") {
    return plugin.isValidNumberPrecise();
  }
  return plugin.isValidNumber();
}

function logCalculation(calculation) {
  const calculationKey = JSON.stringify(calculation);
  if (calculationKey === lastLoggedCalculationKey) return;
  lastLoggedCalculationKey = calculationKey;

  fetch("/api/calculation-log", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      visitorId,
      camp: activeCamp,
      calculation
    })
  }).catch(() => {});
}

if (window.intlTelInput) {
  const armenianPhoneTranslations = {
    selectedCountryAriaLabel: "Փոխել երկիրը. ընտրված է ${countryName} (${dialCode})",
    noCountrySelected: "Ընտրել երկիրը",
    countryListAriaLabel: "Երկրների ցանկ",
    searchPlaceholder: "Որոնել երկիրը",
    clearSearchAriaLabel: "Մաքրել որոնումը",
    searchEmptyState: "Արդյունք չի գտնվել",
    searchSummaryAria: function(count) {
      return count ? `Գտնվել է ${count} արդյունք` : "Արդյունք չի գտնվել";
    }
  };

  const armenianCountryNames = window.MastergateCountryNamesHy || {};
  const countryNameOverrides = {};
  Object.entries(armenianCountryNames).forEach(function([iso2, name]) {
    countryNameOverrides[iso2.toLowerCase()] = `${name} ${armenianToLatin(name)}`;
  });

  function createPhonePlugin(input, countryInput) {
    const plugin = window.intlTelInput(input, {
      initialCountry: "am",
      excludeCountries: ["az"],
      countryNameOverrides: countryNameOverrides,
      separateDialCode: true,
      countrySelectorMode: "DROPDOWN",
      countryOrder: ["am", "ru", "ge", "us", "fr", "de"],
      placeholderNumberPolicy: "AGGRESSIVE",
      uiTranslations: armenianPhoneTranslations
    });

    input.addEventListener("countrychange", function() {
      countryInput.value = (getSelectedPhoneCountry(plugin).iso2 || "am").toUpperCase();
      normalizeArmenianPhoneInput(input, countryInput.id);
      requestAnimationFrame(function() { closePhoneCountryDropdown(input, plugin); });
      const searchInput = input.closest(".phone-input")?.querySelector(".iti__search-input");
      if (searchInput && searchInput.value) {
        searchInput.value = "";
        searchInput.dispatchEvent(new Event("input", { bubbles: true }));
      }
    });
    input.addEventListener("input", function() {
      normalizeArmenianPhoneInput(input, countryInput.id);
    });
    input.closest(".phone-input")?.querySelector(".iti__selected-country")?.addEventListener("click", function() {
      requestAnimationFrame(refreshPhoneCountryNames);
      setTimeout(function() { constrainPhoneCountryDropdown(input); }, 50);
    });
    input.closest(".iti")?.querySelector(".iti__country-list")?.addEventListener("click", function(event) {
      if (!event.target.closest(".iti__country")) return;
      setTimeout(function() { closePhoneCountryDropdown(input, plugin); }, 0);
    });

    return plugin;
  }

  function localizePhoneCountryNames() {
    document.querySelectorAll(".iti__country").forEach(function(countryItem) {
      const visibleName = armenianCountryNames[(countryItem.dataset.iso2 || "").toUpperCase()];
      const nameElement = countryItem.querySelector(".iti__country-name");
      if (visibleName && nameElement && nameElement.textContent.trim() !== visibleName) {
        nameElement.textContent = visibleName;
      }
    });
  }

  function observePhoneCountryList() {
    const phoneCountryList = document.querySelector(".iti__country-list");
    if (!phoneCountryList || phoneCountryList.dataset.localizationObserved) return;

    phoneCountryList.dataset.localizationObserved = "true";
    new MutationObserver(function() {
      localizePhoneCountryNames();
    }).observe(phoneCountryList, { childList: true, subtree: true, characterData: true });
  }

  function refreshPhoneCountryNames() {
    localizePhoneCountryNames();
    observePhoneCountryList();
    constrainPhoneCountryDropdown(document.activeElement?.closest(".phone-input")?.querySelector("input[type='tel']"));
  }

  function constrainPhoneCountryDropdown(input) {
    const wrapper = input?.closest(".phone-input")?.querySelector(".iti") || document.querySelector(".phone-input .iti");
    const dropdown = wrapper?.querySelector(".iti__dropdown-content") || document.querySelector(".iti__dropdown-content");
    if (!wrapper || !dropdown) return;

    const wrapperRect = wrapper.getBoundingClientRect();
    const maxWidth = Math.max(180, Math.min(wrapperRect.width, window.innerWidth - 24));
    dropdown.style.boxSizing = "border-box";
    dropdown.style.width = `${maxWidth}px`;
    dropdown.style.maxWidth = `${maxWidth}px`;
    dropdown.style.minWidth = "0";
    dropdown.style.left = "0";
    dropdown.style.right = "auto";
  }

  phonePlugin = createPhonePlugin(document.getElementById("customerPhone"), document.getElementById("phoneCountry"));
  phoneGatePlugin = createPhonePlugin(document.getElementById("phoneGateInput"), document.getElementById("phoneGateCountry"));
  refreshPhoneCountryNames();
  document.addEventListener("input", function(event) {
    if (event.target.matches(".iti__search-input")) {
      requestAnimationFrame(localizePhoneCountryNames);
      requestAnimationFrame(function() {
        constrainPhoneCountryDropdown(event.target.closest(".phone-input")?.querySelector("input[type='tel']"));
      });
    }
  });
}

function isArmenianPhoneSelected(countryInputId = "phoneCountry") {
  return (document.getElementById(countryInputId).value || "AM").toUpperCase() === "AM";
}

function startsWithZero(value) {
  return /^0/.test(String(value || "").replace(/\D/g, ""));
}

function normalizeArmenianPhoneInput(input, countryInputId = "phoneCountry") {
  if (!input || !isArmenianPhoneSelected(countryInputId)) return;

  const normalized = input.value.replace(/^\D*0+/, "");
  if (normalized !== input.value) {
    const cursor = Math.max(0, (input.selectionStart || 0) - (input.value.length - normalized.length));
    input.value = normalized;
    input.setSelectionRange(cursor, cursor);
  }
}

function closePhoneCountryDropdown(input = document.getElementById("customerPhone"), plugin = null) {
  const phoneInput = typeof input === "string" ? document.getElementById(input) : input;
  const activePlugin = plugin || (phoneInput?.id === "phoneGateInput" ? phoneGatePlugin : phonePlugin);
  if (typeof activePlugin?.closeCountrySelector === "function") {
    activePlugin.closeCountrySelector();
    return;
  }
  const selectedCountry = phoneInput && phoneInput.closest(".iti")?.querySelector(".iti__selected-country");
  if (selectedCountry?.getAttribute("aria-expanded") === "true") {
    selectedCountry.click();
  }
}

function armenianToLatin(value) {
  const letters = {
    "ա": "a", "բ": "b", "գ": "g", "դ": "d", "ե": "e", "զ": "z",
    "է": "e", "ը": "y", "թ": "t", "ժ": "zh", "ի": "i", "լ": "l",
    "խ": "kh", "ծ": "ts", "կ": "k", "հ": "h", "ձ": "dz", "ղ": "gh",
    "ճ": "tch", "մ": "m", "յ": "y", "ն": "n", "շ": "sh", "ո": "o",
    "չ": "ch", "պ": "p", "ջ": "j", "ռ": "r", "ս": "s", "վ": "v",
    "տ": "t", "ր": "r", "ց": "ts", "ւ": "u", "փ": "p", "ք": "q",
    "և": "ev", "օ": "o", "ֆ": "f"
  };
  return value.toLowerCase().replace(/ու/g, "u").replace(/[ա-ֆև]/g, function(letter) {
    return letters[letter] || "";
  });
}

validateFrame();
[w, h].forEach(updateRangeProgress);
applyQueryCalculatorState();
